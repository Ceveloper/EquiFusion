nymeria:
    num_joints: 23 #included hip even if if_consider_hip=False
    fps: 60

    multimodal_threshold: 0.4
    dataset_type: NymeriaDataset
    dataset_name: nymeria
    precomputed_folder: "${dataset_precomputed_path}/Nymeria/${task.task_name}/"
    annotations_folder: "${dataset_annotation_path}/Nymeria/"

    data_loader_train:
        stride: 60
        augmentation: 30
        shuffle: True
        da_mirroring: 0.5
        da_rotations: 1.0
        drop_last: True
        if_load_mmgt: False
        if_permute_keypoints: True


    data_loader_train_eval:
        stride: 30
        augmentation: 0
        shuffle: False
        da_mirroring: 0.
        da_rotations: 0.
        drop_last: False
        if_load_mmgt: False
        if_permute_keypoints: False

    data_loader_valid:
        stride: 30
        augmentation: 0
        shuffle: False
        drop_last: False
        if_load_mmgt: False
        if_permute_keypoints: False
